info:
  name: fetch tracks for gautam page 2
  type: http
  seq: 6

http:
  method: GET
  url: http://localhost:8080/tracks/search?artistName=gautam&page=2&size=5
  params:
    - name: artistName
      value: gautam
      type: query
    - name: page
      value: "2"
      type: query
    - name: size
      value: "5"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

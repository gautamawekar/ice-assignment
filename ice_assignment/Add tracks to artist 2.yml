info:
  name: Add tracks to artist 2
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8080/tracks/artists/2
  body:
    type: json
    data: |-
      {
        "tracks": [
          {
            "title": "A2",
            "genre": "Pop",
            "length": 100
          },
          {
            "title": "B2",
            "genre": "Rock",
            "length": 100
          }
          
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
